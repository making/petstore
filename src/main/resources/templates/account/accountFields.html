
<h3>Account Information</h3>

<table>
    <tr>
        <td><label for="firstName">First name:</label></td>
        <td><input type="text" th:field="*{firstName}"/> <span id="firstName.errors" th:errors="*{firstName}"></span></td>
    </tr>
    <tr>
        <td><label for="lastName">Last name:</label></td>
        <td><input type="text" th:field="*{lastName}"/> <span id="lastName.errors" th:errors="*{lastName}"></span></td>
    </tr>
    <tr>
        <td><label for="email">Email:</label></td>
        <td><input type="email" th:field="*{email}" size="40"/> <span id="email.errors" th:errors="*{email}"></span></td>
    </tr>
    <tr>
        <td><label for="phone">Phone:</label></td>
        <td><input type="text" th:field="*{phone}"/> <span id="phone.errors" th:errors="*{phone}"></span></td>
    </tr>
    <tr>
        <td><label for="address1">Address 1:</label></td>
        <td><input type="text" th:field="*{address1}" size="40"/> <span id="address1.errors" th:errors="*{address1}"></span></td>
    </tr>
    <tr>
        <td><label for="address2">Address 2:</label></td>
        <td><input type="text" th:field="*{address2}" size="40"/> <span id="address2.errors" th:errors="*{address2}"></span></td>
    </tr>
    <tr>
        <td><label for="city">City:</label></td>
        <td><input type="text" th:field="*{city}"/> <span id="city.errors" th:errors="*{city}"></span></td>
    </tr>
    <tr>
        <td><label for="state">State:</label></td>
        <td><input type="text" th:field="*{state}" size="4"/> <span id="state.errors" th:errors="*{state}"></span></td>
    </tr>
    <tr>
        <td><label for="zip">Zip:</label></td>
        <td><input type="text" th:field="*{zip}" size="10"/> <span id="zip.errors" th:errors="*{zip}"></span></td>
    </tr>
    <tr>
        <td><label for="country">Country:</label></td>
        <td><input type="text" th:field="*{country}" size="15"/> <span id="country.errors" th:errors="*{country}"></span></td>
    </tr>
</table>

<h3>Profile Information</h3>

<table>
    <tr>
        <td><label for="languagePreference">Language Preference:</label></td>
        <td><select th:field="*{languagePreference}"><option th:each="item : ${languageList}" th:with="isMap=${languageList instanceof T(java.util.Map)}" th:value="${isMap ? item.key : item}" th:text="${isMap ? item.value : item}"></option></select> <span id="languagePreference.errors" th:errors="*{languagePreference}"></span></td>
    </tr>
    <tr>
        <td><label for="favouriteCategoryId">Favourite Category:</label></td>
        <td><select th:field="*{favouriteCategoryId}"><option th:each="item : ${categoryList}" th:with="isMap=${categoryList instanceof T(java.util.Map)}" th:value="${isMap ? item.key : item}" th:text="${isMap ? item.value : item}"></option></select> <span id="favouriteCategoryId.errors" th:errors="*{favouriteCategoryId}"></span></td>
    </tr>
    <tr>
        <td><input type="checkbox" id="listOption" name="listOption" value="true" th:checked="*{listOption}"/>
<input type="hidden" name="_listOption" value="on"/>
            <label for="listOption">Enable MyList</label></td>
        <td><span id="listOption.errors" th:errors="*{listOption}"></span></td>
    </tr>
    <tr>
        <td><input type="checkbox" id="bannerOption" name="bannerOption" value="true" th:checked="*{bannerOption}"/>
<input type="hidden" name="_bannerOption" value="on"/>
            <label for="bannerOption">Enable MyBanner</label></td>
        <td><span id="bannerOption.errors" th:errors="*{bannerOption}"></span></td>
    </tr>
</table>
