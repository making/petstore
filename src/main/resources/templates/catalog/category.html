

<!DOCTYPE html>
<html>
<head>
    <th:block th:insert="~{common/head}"></th:block>
</head>
<body>
<th:block th:insert="~{common/header}"></th:block>
<div id="Content">
    <th:block th:insert="~{common/backlink}"></th:block>

    <div id="Catalog">

        <h2>[[${category.name}]]</h2>

        <table>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
            </tr>
            <th:block th:each="product : ${productList}">
                <tr>
                    <td><a
                            th:href="@{/catalog/products/{productId}(productId=${product.productId})}">[[${product.productId}]]</a>
                    </td>
                    <td>[[${product.name}]]</td>
                </tr>
            </th:block>
        </table>

    </div>
</div>
<th:block th:insert="~{common/footer}"></th:block>
</body>
